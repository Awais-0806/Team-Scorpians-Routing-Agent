# Team Scorpians - full stack for AMD Developer Cloud
#
# `local-model`: ROCm-compatible container serving Gemma 4 E4B locally via vLLM.
#                Pinned to v0.18.1 per team spec. Note: vllm/vllm-openai-rocm
#                has since released newer tags (v0.23.0 as of early July 2026) --
#                if v0.18.1 gives you GPU-detection trouble on the day, swap in
#                `:latest` as a quick fix.
# `agent`:       the FastAPI router (router_agent.py + gemma_fireworks.py).
#
# Run on AMD Developer Cloud with:  docker compose up --build

version: "3.8"

services:
  local-model:
    image: vllm/vllm-openai-rocm:v0.18.1
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
    ipc: host
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    ports:
      - "8000:8000"
    environment:
      # Gemma weights are gated on Hugging Face -- accept the license at
      # huggingface.co/google/gemma-4-e4b-it BEFORE first pull, or the
      # container will fail to download the model.
      - HF_TOKEN=${HF_TOKEN}
    command: ["--model", "google/gemma-4-e4b-it", "--max-model-len", "8192"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s

  agent:
    build: .
    depends_on:
      local-model:
        condition: service_healthy
    environment:
      - FIREWORKS_API_KEY=${FIREWORKS_API_KEY}
      - LOCAL_BASE_URL=http://local-model:8000/v1
      - LOCAL_MODEL=google/gemma-4-e4b-it
      - FIREWORKS_MODEL=accounts/fireworks/models/gemma-4-31b-it
      - CONFIDENCE_THRESHOLD=0.6
      - SELF_CONSISTENCY_SAMPLES=2
    ports:
      - "8080:8080"
